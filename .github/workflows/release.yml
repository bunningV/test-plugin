name: Release

# Runs when a version tag such as v1.0.1 is pushed. Builds test-plugin.zip and
# attaches it to a GitHub release, which the plugin's update checker picks up.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^ \* Version:' caltech-security.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -E "define\('CALTECH_SECURITY_VERSION'" caltech-security.php | sed -E "s/.*'([^']+)'.*/\1/")
          STABLE=$(grep -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER constant=$CONST stable_tag=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "Version mismatch. Set the plugin header, CALTECH_SECURITY_VERSION and readme.txt Stable tag to $TAG before tagging." >&2
            exit 1
          fi

      - name: Build plugin zip
        # WordPress needs the zip to contain exactly one folder, test-plugin/, with the plugin files inside.
        run: |
          STAGE=build/test-plugin
          mkdir -p "$STAGE"
          cp -r caltech-security.php readme.txt uninstall.php includes assets composer.json composer.lock "$STAGE/"
          (cd "$STAGE" && composer install --no-dev --optimize-autoloader --no-interaction)
          rm "$STAGE/composer.json" "$STAGE/composer.lock"
          (cd build && zip -rq ../test-plugin.zip test-plugin)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" test-plugin.zip \
            --title "$GITHUB_REF_NAME" --generate-notes

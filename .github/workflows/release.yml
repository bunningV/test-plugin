name: Release

# Runs when a version tag such as v1.0.1 is pushed. Builds test-plugin.zip and
# attaches it to a GitHub release, which the plugin's update checker picks up.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^ \* Version:' test-plugin/caltech-security.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -E "define\('CALTECH_SECURITY_VERSION'" test-plugin/caltech-security.php | sed -E "s/.*'([^']+)'.*/\1/")
          STABLE=$(grep -E '^Stable tag:' test-plugin/readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER constant=$CONST stable_tag=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "Version mismatch. Set the plugin header, CALTECH_SECURITY_VERSION and readme.txt Stable tag to $TAG before tagging." >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Install runtime dependencies
        working-directory: test-plugin
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build zip
        # The zip must unpack to a single test-plugin/ folder so WordPress installs it in place.
        run: |
          zip -r test-plugin.zip test-plugin \
            -x 'test-plugin/composer.json' 'test-plugin/composer.lock'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" test-plugin.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
